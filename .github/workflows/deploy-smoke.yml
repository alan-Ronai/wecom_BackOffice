name: deploy-smoke

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-smoke.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-smoke.yml'

jobs:
  deploy-smoke:
    runs-on: ubuntu-latest
    # Expected runtime ~12–16 min on a standard runner: ~1 min for the config/lint checks,
    # ~2 min for deploy/backup-check.sh, ~6–9 min to build the three images (the api image runs a
    # full pnpm install and tsc), ~1 min to pull the small CI model, and under a minute for the
    # stack to come up and answer the smoke test. The cap is generous on purpose — it should fire
    # only when something is genuinely stuck, not when a runner is slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: self-signed cert
        run: |
          mkdir -p deploy/certs
          cd deploy/certs && openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 1 -subj "/CN=localhost"

      # The api service declares `env_file: .env` (relative to
      # deploy/docker-compose.yml); that's distinct from `--env-file`, which
      # only feeds ${VAR} interpolation in the compose YAML itself. Without
      # this, `docker compose config` fails with "env file ... not found".
      - name: materialize deploy/.env for compose
        run: cp deploy/ci.env deploy/.env

      - name: validate nginx.conf, ollama-pull.sh, INSTALL.md
        run: |
          deploy/nginx-check.sh
          deploy/ollama-pull-check.sh
          deploy/install-check.sh

      - name: validate compose config
        run: docker compose --env-file deploy/ci.env -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml config

      - name: backup/restore round trip
        run: deploy/backup-check.sh

      - name: Lint the WordPress plugin (PHP syntax)
        run: docker run --rm -v "$PWD/deploy/wp-plugin:/app" php:8.2-cli php -l /app/kb-sync.php

      # apps/api and apps/web now exist (L2/L4 landed) — the images build and the
      # composed stack actually comes up, so this is a real gate. Nothing in this job is
      # `continue-on-error`: every step here must pass for the job to be green.
      - name: build images
        id: build
        run: docker compose --env-file deploy/ci.env -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml build

      - name: up
        run: docker compose --env-file deploy/ci.env -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml up -d

      # The pull is a one-shot service, so `up -d` returns before it finishes. Waiting on it here
      # means a pull failure reads as "the model pull failed, and here is its log" instead of
      # surfacing five minutes later as an unexplained smoke timeout.
      - name: wait for the model pull
        run: |
          set -euo pipefail
          compose() { docker compose --env-file deploy/ci.env -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml "$@"; }
          id=$(compose ps -aq ollama-pull)
          for i in $(seq 1 120); do
            state=$(docker inspect -f '{{.State.Status}}' "$id")
            [ "$state" = "exited" ] && break
            sleep 5
          done
          # --tail: `ollama pull` redraws a progress bar thousands of times even without a TTY,
          # and the last lines are the ones that say whether it finished.
          compose logs --tail 20 ollama-pull
          code=$(docker inspect -f '{{.State.ExitCode}}' "$id")
          test "$code" = "0" || { echo "ollama-pull exited $code"; exit 1; }

      # No SMOKE_REQUIRE_MODEL=false: the CI stack pulls a real (small) model, so this asserts the
      # same thing an operator's run on the VM does — db reachable, the configured MODEL_NAME tag
      # actually present, a request id on the response, the SPA served, and the O-1 security
      # headers on `GET /`.
      - name: smoke
        id: smoke
        run: deploy/smoke.sh https://localhost:8443

      - name: logs on failure
        if: always()
        run: docker compose --env-file deploy/ci.env -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml logs || true

      - name: down
        if: always()
        run: docker compose --env-file deploy/ci.env -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml down -v || true
