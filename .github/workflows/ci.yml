# Every job below sets `timeout-minutes`. The GitHub default is 360 — six hours of a runner, and
# six hours before anyone learns a job is wedged rather than slow. The caps here are roughly triple
# the expected runtime: they should fire only when something is genuinely stuck (a hung
# testcontainer, a Playwright run waiting on a server that never came up), never on a slow runner.
name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    # ~8–12 min: install, lint, typecheck, the workspace build, unit tests, then `test:int` against
    # a testcontainers Postgres, which is the long pole and the one that can hang.
    timeout-minutes: 30
    # No `services:` block on purpose. `test:int` brings up its own Postgres through
    # testcontainers (`apps/api/test/helpers/db.ts` -> `startTestDb`), so a service container
    # here was started and health-checked on every run without a single test connecting to it.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r build
      - run: pnpm test
      - run: pnpm --filter @wecom/api test:int
        env: { RUN_INTEGRATION: '1', TESTCONTAINERS_RYUK_DISABLED: 'true' }
      - name: OpenAPI contract check
        run: |
          pnpm --filter @wecom/api openapi
          git diff --exit-code -- docs/api/openapi.json || (echo 'openapi.json is stale: run pnpm openapi and commit' && exit 1)
      - name: Lint the WordPress plugin (PHP syntax)
        run: docker run --rm -v "$PWD/deploy/wp-plugin:/app" php:8.2-cli php -l /app/kb-sync.php

  e2e:
    runs-on: ubuntu-latest
    needs: build
    # ~6–9 min: install, build, a chromium download, then the msw-backed specs. A browser waiting
    # on a page that never loads is exactly the shape of hang this cap is for.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @wecom/web exec playwright install --with-deps chromium
      # Runs against the msw-backed dev build. Once the Compose stack from L1 is
      # available in CI, set E2E_BASE_URL (and E2E_OIDC=1) to exercise the real API.
      - run: pnpm --filter @wecom/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  perf:
    # §11 non-functional gate: library reads < 300 ms, search < 500 ms (p95) at 5,000
    # documents. See apps/api/scripts/{load-fixture,perf-check}.ts.
    runs-on: ubuntu-latest
    needs: build
    # ~2–4 min of measurement on top of install and build, against a testcontainers Postgres.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @wecom/api perf:check
        env: { TESTCONTAINERS_RYUK_DISABLED: 'true' }

  audit:
    # docs/security-advisories.md calls `pnpm audit --prod` the gate and "a release blocker", and
    # until now nothing ran it — a standing decision no machine checks is a decision about the day
    # it was written. scripts/audit-check.mjs runs it against .github/audit-allowlist.json, the
    # machine-readable half of that document's "Accepted, with reasons" table, and fails on an
    # advisory nobody has excused, an acceptance past its review date, an entry whose advisory has
    # been fixed, and an entry whose stated reason has stopped being true.
    #
    # Not `needs: build`: it depends on the lockfile alone, so it should answer in a minute on its
    # own rather than behind a ten-minute build.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:check

  e2e-real:
    # The no-mocks gate: a real Postgres, the real API (NODE_ENV=production, no msw
    # anywhere) and the built SPA under vite preview — see scripts/e2e-real.mjs. Separate
    # from `e2e` above (which is fast msw-backed component coverage) rather than a
    # replacement for it: this one catches contract drift between the frontend and the
    # real backend that a mocked API cannot.
    runs-on: ubuntu-latest
    needs: build
    # ~10–14 min: install, build, chromium, then a Postgres container, migrate/seed/create-admin,
    # the API and `vite preview` and the specs against all of it. The most moving parts of the
    # five, and the one most likely to sit waiting on a server that never becomes healthy.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @wecom/web exec playwright install --with-deps chromium
      - run: pnpm e2e:real
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-real-results
          path: apps/web/test-results
          retention-days: 7
