worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"ms":$request_time,"requestId":"$upstream_http_x_request_id"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  client_max_body_size 50m;                       # docx uploads

  # Resolve the "api" upstream lazily via Docker's embedded DNS instead of a
  # static `upstream {}` block, so `nginx -t` doesn't require the api
  # container to be resolvable at config-load time and nginx re-resolves if
  # the container is recreated with a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    root /usr/share/nginx/html;

    location /api/ {
      set $api_upstream http://api:3000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;                    # model calls can be slow on CPU
    }

    # SSE. The API serves /api/v1/events, which already matches `location /api/`
    # above, so this block never matches a real request — it is kept as the explicit
    # place to put SSE proxy settings if the stream is ever moved off the /api prefix.
    # Streaming works today because the handler sets `x-accel-buffering: no`.
    location /events {
      set $api_upstream http://api:3000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;                        # SSE
      proxy_cache off;
      proxy_read_timeout 1h;
      chunked_transfer_encoding off;
    }

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
  }
}
