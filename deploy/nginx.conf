worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"ms":$request_time,"requestId":"$upstream_http_x_request_id"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  # Matches @fastify/multipart's 25 MB fileSize limit in apps/api/src/app.ts: a larger body
  # was proxied all the way to Fastify only to be rejected there (acceptance review §5).
  client_max_body_size 25m;                       # docx uploads

  # Resolve the "api" upstream lazily via Docker's embedded DNS instead of a
  # static `upstream {}` block, so `nginx -t` doesn't require the api
  # container to be resolvable at config-load time and nginx re-resolves if
  # the container is recreated with a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # See the file's header comment: nginx drops every inherited add_header in any location that
    # declares one of its own, so this include is repeated in each location block below.
    include /etc/nginx/security-headers.conf;

    root /usr/share/nginx/html;

    # ── on X-Forwarded-For ───────────────────────────────────────────────────────────────────
    # `$remote_addr`, deliberately, and never `$proxy_add_x_forwarded_for`: the latter *appends*
    # the connecting address to whatever the client sent, so with `TRUST_PROXY` naming this hop
    # the API unwound the list to the left-most address the client itself had chosen — and
    # `req.ip` is what the Palo Alto User-ID allowlist is checked against. Any client that could
    # reach nginx could therefore be identified as whoever the firewall maps. Replacing the
    # header makes the address the API sees the address the connection actually came from.
    #
    # The cost is that a legitimate proxy in front of nginx would have its client address
    # discarded. There is none in this deployment (nginx is the edge); if one is ever added, put
    # the append back *here only*, and keep `TRUST_PROXY_HOPS` at the number of hops that proxy
    # adds — see deploy/INSTALL.md, "Reverse proxy".
    #
    # deploy/nginx-check.sh asserts both halves of this: every proxying location sets
    # `X-Forwarded-For $remote_addr`, and the file never mentions `$proxy_add_x_forwarded_for`.
    location /api/ {
      include /etc/nginx/security-headers.conf;
      set $api_upstream http://api:3000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;                    # model calls can be slow on CPU
    }

    # SSE. The events module is registered inside the API's /api/v1 scope, so the stream is at
    # /api/v1/events — the old `location /events` block never matched it (and with a variable
    # upstream and no URI part, proxy_pass forwarded the original URI, so those requests 404'd).
    #
    # An *exact* match outranks the /api/ prefix block above, so this is what actually governs the
    # stream: without it SSE inherits /api/'s 300s read timeout. The handler also sets
    # `x-accel-buffering: no`, which disables buffering on its own; the explicit settings here are
    # the belt to that suspenders, and the place to change SSE proxying if the path ever moves.
    location = /api/v1/events {
      include /etc/nginx/security-headers.conf;
      set $api_upstream http://api:3000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Replaces, never appends — see the note on the /api/ block above.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;                        # SSE
      proxy_cache off;
      proxy_read_timeout 1h;
      chunked_transfer_encoding off;
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      expires 30d;
      add_header Cache-Control "public, immutable" always;
    }
    location / {
      include /etc/nginx/security-headers.conf;
      try_files $uri /index.html;
      add_header Cache-Control "no-cache" always;
    }
  }
}
