worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"ms":$request_time,"requestId":"$upstream_http_x_request_id"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  client_max_body_size 50m;                       # docx uploads

  # Resolve the "api" upstream lazily via Docker's embedded DNS instead of a
  # static `upstream {}` block, so `nginx -t` doesn't require the api
  # container to be resolvable at config-load time and nginx re-resolves if
  # the container is recreated with a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    # The app loads no third-party scripts, styles or fonts and has exactly one
    # dangerouslySetInnerHTML (all inputs escaped by @wecom/shared's formatter), so a strict
    # same-origin policy costs nothing. 'unsafe-inline' on style-src covers React inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    root /usr/share/nginx/html;

    location /api/ {
      set $api_upstream http://api:3000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;                    # model calls can be slow on CPU
    }

    # SSE. The events module is registered inside the API's /api/v1 scope, so the stream is at
    # /api/v1/events — the old `location /events` block never matched it (and with a variable
    # upstream and no URI part, proxy_pass forwarded the original URI, so those requests 404'd).
    #
    # An *exact* match outranks the /api/ prefix block above, so this is what actually governs the
    # stream: without it SSE inherits /api/'s 300s read timeout. The handler also sets
    # `x-accel-buffering: no`, which disables buffering on its own; the explicit settings here are
    # the belt to that suspenders, and the place to change SSE proxying if the path ever moves.
    location = /api/v1/events {
      set $api_upstream http://api:3000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;                        # SSE
      proxy_cache off;
      proxy_read_timeout 1h;
      chunked_transfer_encoding off;
    }

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
  }
}
