# Security response headers — the single source of truth, `include`d from `server` *and* from
# every `location` block.
#
# Why the repetition: nginx's `add_header` inheritance is all-or-nothing per configuration level.
# A `location` that declares *any* `add_header` of its own discards **every** header inherited
# from the enclosing `server`. `location /` and `location /assets/` both set `Cache-Control`, so
# before this file the two responses the browser actually renders — the app document and the JS
# bundle — carried no CSP, no HSTS, no nosniff and no X-Frame-Options at all (acceptance review
# O-1). The `/api/` and `= /api/v1/events` blocks declare no `add_header` today and so would
# inherit, but including the snippet there too means adding one cache or CORS header to a proxy
# block can never silently strip the security set again.
#
# `always` keeps the headers on error responses (401/404/502) as well as 2xx.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
# No cross-origin destination needs our path or query; the origin alone is enough for
# same-origin navigation and for any future upstream that logs a referrer.
add_header Referrer-Policy strict-origin-when-cross-origin always;
# The app loads no third-party scripts, styles or fonts and has exactly one
# dangerouslySetInnerHTML (all inputs escaped by @wecom/shared's formatter), so a strict
# same-origin policy costs nothing. 'unsafe-inline' on style-src covers React inline styles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
