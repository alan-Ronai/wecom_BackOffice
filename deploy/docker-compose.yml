name: wecom-kb

# ── W-8: every container's log is capped ─────────────────────────────────────────────────────
# Docker's default json-file driver has no `max-size` at all: a log grows until the disk is full,
# and the first symptom is Postgres refusing writes on a pilot VM with a single partition. Six
# services, one of them an API logging a line per request and one an Ollama logging per token,
# all running `restart: unless-stopped` for months.
#
# 20 MB × 5 files is a ceiling of 100 MB per container — ~600 MB for the stack, against the
# ~6 GB the images already take — and keeps enough history for the questions these logs get
# asked (why did last night's backup fail, what did nginx see when the browser got a 502).
# `max-file` counts the active file, so 5 means the current log plus four rotations.
#
# Both option values are quoted: compose passes logging options to the daemon as strings, and an
# unquoted `5` is a YAML integer that some compose/daemon combinations reject outright.
#
# A YAML anchor rather than six copies, because six copies is how five of them end up capped and
# the sixth — always the noisy one — does not. `deploy/compose-check.sh` asserts, through
# `docker compose config`, that every service in this file resolves to this block; an anchor that
# a new service forgets to reference is exactly the failure it catches.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kb
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U kb -d kb"], interval: 5s, timeout: 5s, retries: 20 }
    logging: *logging
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    environment: { OLLAMA_KEEP_ALIVE: 30m, OLLAMA_NUM_PARALLEL: 1, OLLAMA_MAX_LOADED_MODELS: 1 }
    healthcheck: { test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"], interval: 10s, timeout: 5s, retries: 30 }
    logging: *logging
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["/bin/bash", "/ollama-pull.sh"]
    # EMBED_MODEL as well as MODEL_NAME (W-3). It used to pass only the generation tag, so the
    # embedding model deploy/.env.example configures was never pulled on any install and search
    # silently ranked lexically for ever. `:-` because an empty value is a real configuration
    # (no embedding model) and must not become an interpolation error.
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      MODEL_NAME: "${MODEL_NAME}"
      EMBED_MODEL: "${EMBED_MODEL:-}"
    volumes: ["./ollama-pull.sh:/ollama-pull.sh:ro"]
    depends_on: { ollama: { condition: service_healthy } }
    logging: *logging
    restart: "no"

  # ── on ${COMPOSE_PROJECT_NAME} in the three `image:` tags below ──────────────────────────────
  # They were unprefixed — `wecom-kb-api`, `-web`, `-backup` — so *every* compose project built
  # from this file wrote the same three tags. A second stack (`-p wecom-walk2 … up --build`, a
  # walkthrough, a colleague's clone) therefore replaced the images a running `pnpm e2e:compose`
  # was using, mid-run, with no warning and nothing in either run's output to explain the result.
  # scripts/e2e-compose.mjs is careful about the project name and the volumes for exactly this
  # reason; the image tags were the hole left in it.
  #
  # `${COMPOSE_PROJECT_NAME}` is compose's own effective project name — the `name:` at the top of
  # this file, or whatever `-p` / COMPOSE_PROJECT_NAME overrides it with — so these are precisely
  # the names compose would pick itself with no `image:` at all. The default project still builds
  # `wecom-kb-api`/`-web`/`-backup`, unchanged for an operator on the VM; `-p wecom-kb-e2e` now
  # builds `wecom-kb-e2e-api` and can no longer touch them. `:-wecom-kb` is belt and braces for a
  # compose old enough not to export the variable.
  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    image: ${COMPOSE_PROJECT_NAME:-wecom-kb}-api
    env_file: .env
    environment:
      DATABASE_URL: postgres://kb:${POSTGRES_PASSWORD}@db:5432/kb
      MODEL_URL: http://ollama:11434
    depends_on:
      db: { condition: service_healthy }
      ollama: { condition: service_healthy }
    # ./backups is read-only here so `system.backup-check` can see the nightly dumps.
    volumes: [uploads:/data/uploads, ./backups:/backups:ro, watch:/data/watch]
    logging: *logging
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    image: ${COMPOSE_PROJECT_NAME:-wecom-kb}-web
    ports: ["${WEB_HTTPS_PORT:-443}:443", "${WEB_HTTP_PORT:-80}:80"]
    volumes:
      - ${TLS_CERT_PATH}:/etc/nginx/certs/cert.pem:ro
      - ${TLS_KEY_PATH}:/etc/nginx/certs/key.pem:ro
    depends_on: [api]
    logging: *logging
    restart: unless-stopped

  backup:
    build: { context: .., dockerfile: deploy/backup.Dockerfile }
    image: ${COMPOSE_PROJECT_NAME:-wecom-kb}-backup
    environment:
      DATABASE_URL: postgres://kb:${POSTGRES_PASSWORD}@db:5432/kb
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: Asia/Jerusalem
    volumes: [./backups:/backups]
    depends_on: { db: { condition: service_healthy } }
    logging: *logging
    restart: unless-stopped

volumes:
  dbdata: {}
  ollama: {}
  uploads: {}
  watch: {}
